<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fit Claro</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#eceff3;--card:#fff;--tx:#18212c;--mut:#667282;--ac:#e8590c;--ac2:#1f3a5f;--bd:#d9dee5;--in:#f5f7fa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151c;--card:#19202a;--tx:#edf0f4;--mut:#93a0b0;--ac:#ff8a4c;--ac2:#8fb4e8;--bd:#2b3441;--in:#121820}}
:root[data-theme="dark"]{--bg:#10151c;--card:#19202a;--tx:#edf0f4;--mut:#93a0b0;--ac:#ff8a4c;--ac2:#8fb4e8;--bd:#2b3441;--in:#121820}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 Barlow,system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:12px 14px 40px}
h1{font:700 30px/1 "Barlow Condensed",Impact,sans-serif;margin:14px 0 10px;letter-spacing:.3px}
h2{font:700 20px/1.1 "Barlow Condensed",Impact,sans-serif;margin:0 0 8px}
nav{display:flex;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:5}
nav button{flex:1;padding:11px 2px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:600 15px Barlow,sans-serif}
nav button.on{background:var(--ac2);color:#fff;border-color:var(--ac2)}
:root[data-theme="dark"] nav button.on{color:#10151c}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) nav button.on{color:#10151c}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:0 0 10px}
.row{display:flex;gap:8px;align-items:center;margin:0 0 8px;flex-wrap:wrap}
.row:last-child{margin:0}
.grow{flex:1;min-width:0}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--in);color:var(--tx);font:16px Barlow,sans-serif}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
textarea{resize:vertical;min-height:52px}
label{display:block;font-size:14px;color:var(--mut)}
.s{width:calc(33% - 6px);flex:none}
.pills{display:flex;gap:6px;overflow-x:auto;margin:0 0 10px;padding-bottom:2px}
.pill{flex:none;padding:8px 14px;border-radius:20px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:600 15px Barlow,sans-serif}
.pill.on{background:var(--ac);border-color:var(--ac);color:#fff}
.btn{padding:11px 14px;border-radius:10px;border:0;background:var(--ac);color:#fff;font:600 16px Barlow,sans-serif}
.ghost{background:none;border:1px dashed var(--mut);color:var(--tx);width:100%}
.x{background:none;border:0;color:var(--mut);font-size:20px;padding:6px 10px}
.chip{padding:6px 10px;border-radius:16px;border:1px solid var(--bd);background:var(--in);color:var(--tx);font:500 14px Barlow,sans-serif}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 10px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}
.stat b{display:block;font:700 28px/1.1 "Barlow Condensed",Impact,sans-serif}
.stat span{font-size:13px;color:var(--mut)}
.up{color:var(--ac)}
.note{font-size:14px;color:var(--mut);margin:6px 0 0}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:8px 4px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
.tag{font-size:12px;border:1px solid var(--ac);color:var(--ac);border-radius:10px;padding:1px 7px;margin-left:4px}
svg{width:100%;height:auto;display:block}
.done input[type=text]{text-decoration:line-through;opacity:.6}
input[type=checkbox]{width:24px;height:24px;flex:none;accent-color:var(--ac)}
body,button,input,select,textarea,h1,h2,b,td,th{font-family:Inter,system-ui,sans-serif!important}
main{padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
header{margin:-12px -14px 14px;padding:14px 16px;background:linear-gradient(90deg,#1553f0,#1d5cff);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1{margin:0;font-size:22px;font-weight:700;color:#fff}
header span{display:block;font-size:12px;opacity:.9}
header i{font-style:normal;font-size:11px;opacity:.85;text-align:right;max-width:45%}
nav{position:fixed;left:50%;transform:translateX(-50%);top:auto;bottom:0;width:100%;max-width:640px;margin:0;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--bd);gap:0}
nav button{border:0!important;background:none!important;color:var(--mut)!important;border-radius:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:4px 0}
nav button.on{color:var(--ac)!important;font-weight:600}
h2{font-size:18px;font-weight:600}
.card,.stat{border-radius:14px;box-shadow:0 1px 2px rgba(15,23,42,.06)}
.btn:not(.ghost){background:#0a0a14}
@media(prefers-color-scheme:dark){.btn:not(.ghost){background:var(--ac)}}
.pill.on{background:#1553f0;border-color:#1553f0}
.stat b{font-size:24px;font-weight:700}
.stat.sc{text-align:center;padding:16px 8px}
.act{display:flex;gap:10px;align-items:center;width:100%;padding:14px;margin:0 0 8px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-size:15px;text-align:left}
.quote{background:#1553f0;color:#fff;border-radius:12px;padding:14px;text-align:center;font-size:14px}
.mac{gap:6px}.m4{width:calc(50% - 3px);flex:none;font-size:12px}
.g4{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g4 span{font-size:12px;color:var(--mut)}
.tot{background:color-mix(in srgb,var(--ac) 10%,var(--card))}
</style></head><body><main>
<header><div><h1>Fit Claro</h1><span>Seu app de treinos e dieta</span></div><i id="sync">Salvo neste aparelho</i></header>
<nav id="nav"></nav>
<div id="v"></div>
</main>
<script>
var K="meutreino1",D=["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"],S=["06:00","09:00","12:00","15:00","18:30","21:00"];
var today=new Date().toISOString().slice(0,10);
var tab="i",cur="A",day=(new Date().getDay()+6)%7;
function load(){try{var x=JSON.parse(localStorage.getItem(K));if(x)return x}catch(e){}return{h:177,days:3,plan:{},meals:{},w:[{d:today,k:63}],fav:[],t:0}}
var st=load();if(st.t==null)st.t=Date.now();
function save(){st.t=Date.now();lsave();push()}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fd(d){return d.split("-").reverse().join("/")}
function nav(){var T=[["i","Início","🏠"],["t","Treinos","🏋️"],["a","Dieta","🍽️"],["g","Progresso","📈"],["p","Perfil","👤"]];
document.getElementById("nav").innerHTML=T.map(function(t){return'<button class="'+(t[0]==tab?"on":"")+'" data-a="tab" data-v="'+t[0]+'"><span style="font-size:20px">'+t[2]+"</span>"+t[1]+"</button>"}).join("")}
function pl(L){return'<div class="pills">'+L.split("").map(function(l){return'<button class="pill '+(l==cur?"on":"")+'" data-a="tr" data-v="'+l+'">Treino '+l+"</button>"}).join("")+'<button class="pill '+(cur=="run"?"on":"")+'" data-a="tr" data-v="run">Corrida</button><button class="pill '+(cur=="evo"?"on":"")+'" data-a="tr" data-v="evo">Evolução</button></div>'}
function vT(){var L="ABCDEF".slice(0,st.days);if(cur!="evo"&&cur!="run"&&L.indexOf(cur)<0)cur="A";if(cur=="evo")return vE(L);if(cur=="run")return pl(L)+vC();var ex=st.plan[cur]||[];
var h='<div class="card"><label>Dias de treino por semana<select data-a="days">'+[2,3,4,5,6].map(function(n){return"<option"+(n==st.days?" selected":"")+">"+n+"</option>"}).join("")+"</select></label></div>";
h+=pl(L);
if(!ex.length)h+='<p class="note">Treino '+cur+' está vazio. Adicione o primeiro exercício.</p>';
ex.forEach(function(e,i){var b='data-a="ex" data-i="'+i+'" data-f=';
h+='<div class="card'+(e.done?" done":"")+'"><div class="row"><input type="checkbox" '+b+'"done"'+(e.done?" checked":"")+' aria-label="Feito"><input type="text" class="grow" '+b+'"n" value="'+esc(e.n)+'" placeholder="Exercício"><button class="x" data-a="rmex" data-i="'+i+'" aria-label="Remover">✕</button></div>'
+'<div class="row"><label class="s">Séries<input type="number" inputmode="numeric" '+b+'"s" value="'+esc(e.s)+'"></label><label class="s">Reps<input type="number" inputmode="numeric" '+b+'"r" value="'+esc(e.r)+'"></label><label class="s">Carga (kg)<input type="number" inputmode="decimal" '+b+'"l" value="'+esc(e.l)+'"></label></div></div>'});
return h+'<button class="btn ghost" data-a="addex">+ Adicionar exercício</button>'+(ex.length?'<button class="btn" style="width:100%;margin-top:10px" data-a="savetr">Salvar treino de hoje no histórico</button><p class="note">Ao salvar, as cargas vão para o histórico e aparecem na aba Evolução. As marcações de feito são limpas para o próximo treino.</p>':"")}
function vA(){var m=st.meals[day]||{};
var h='<div class="pills">'+D.map(function(d,i){return'<button class="pill '+(i==day?"on":"")+'" data-a="dy" data-v="'+i+'">'+d+"</button>"}).join("")+"</div>";
h+=tc(day)+dl();S.forEach(function(s,i){var x=m[i]||{},b='data-a="ml" data-s="'+i+'" data-f=';
h+='<div class="card"><div class="row"><h2 class="grow">Refeição das '+s.replace(":00","h").replace(":30","h30")+'</h2></div><div class="row"><label class="grow">Hora real<input type="time" '+b+'"time" value="'+esc(x.time||s)+'"></label><label class="grow">Peso total (g)<input type="number" inputmode="numeric" '+b+'"g" value="'+esc(x.g)+'" placeholder="opcional"></label></div>'
+'<label>O que comeu<textarea '+b+'"txt" placeholder="Ex.: arroz, feijão, frango grelhado, salada">'+esc(x.txt)+"</textarea></label>"+fb("s"+i)+fl(x,"s"+i)+mf(b,x)+'<div class="row" style="margin-top:8px">'+((st.fav||[]).length?'<select class="grow" data-a="usefav" data-s="'+i+'"><option value="">Usar refeição salva</option>'+st.fav.map(function(f,j){return'<option value="'+j+'">'+esc(f.n)+"</option>"}).join("")+"</select>":"")+'<button class="chip" data-a="savefav" data-s="'+i+'">Salvar como frequente</button></div></div>'});
var X=(st.xm&&st.xm[day])||[];
X.forEach(function(x,i){var b='data-a="mx" data-i="'+i+'" data-f=';
h+='<div class="card"><div class="row"><h2 class="grow">Refeição extra</h2><button class="x" data-a="rmx" data-i="'+i+'" aria-label="Remover">✕</button></div><div class="row"><label class="grow">Hora<input type="time" '+b+'"time" value="'+esc(x.time||"")+'"></label><label class="grow">Peso total (g)<input type="number" inputmode="numeric" '+b+'"g" value="'+esc(x.g)+'" placeholder="opcional"></label></div><label>O que comeu<textarea '+b+'"txt" placeholder="Ex.: sanduíche natural, fruta">'+esc(x.txt)+"</textarea></label>"+fb("x"+i)+fl(x,"x"+i)+mf(b,x)+'<div class="row" style="margin-top:8px">'+((st.fav||[]).length?'<select class="grow" data-a="usefavx" data-i="'+i+'"><option value="">Usar refeição salva</option>'+st.fav.map(function(f,j){return'<option value="'+j+'">'+esc(f.n)+"</option>"}).join("")+"</select>":"")+'<button class="chip" data-a="savefavx" data-i="'+i+'">Salvar como frequente</button></div></div>'});
h+='<button class="btn ghost" data-a="addx">+ Adicionar refeição fora de hora</button>';
if((st.fav||[]).length){h+='<div class="card" style="margin-top:10px"><h2>Refeições salvas</h2>'+st.fav.map(function(f,j){return'<div class="row"><span class="grow">'+esc(f.n)+(f.g?" ("+esc(f.g)+" g)":"")+'</span><button class="x" data-a="rmfav" data-i="'+j+'" aria-label="Remover">✕</button></div>'}).join("")+"</div>"}
return h+'<p class="note">Em breve: avaliação automática por IA, dizendo se cada refeição foi boa e estimando calorias e proteína.</p>'}
function chart(w,lb){if(w.length<2)return"";var t0=+new Date(w[0].d),t1=+new Date(w[w.length-1].d),ks=w.map(function(x){return x.k}),mn=Math.min.apply(null,ks)-1,mx=Math.max.apply(null,ks)+1,sp=(t1-t0)||1;
var P=w.map(function(x){return[10+280*((+new Date(x.d)-t0)/sp),110-100*((x.k-mn)/(mx-mn))]});
return'<svg viewBox="0 0 300 120" role="img" aria-label="Gráfico de '+(lb||"peso")+'"><polyline fill="none" stroke="var(--ac)" stroke-width="2.5" points="'+P.map(function(p){return p.join(",")}).join(" ")+'"/>'+P.map(function(p){return'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" fill="var(--ac)"/>'}).join("")+"</svg>"}
function vP(){var w=st.w,real=w.filter(function(x){return x.d<=today}),now=real[real.length-1]||w[0],f=w[0];
var imc=now&&st.h?(now.k/Math.pow(st.h/100,2)).toFixed(1):"-",dv=now&&f?now.k-f.k:0;
var h='<div class="stats"><div class="stat"><b>'+(now?now.k:"-")+' kg</b><span>Peso atual'+(now?" ("+fd(now.d)+")":"")+'</span></div><div class="stat"><b>'+(dv>0?"+":"")+dv.toFixed(1)+' kg</b><span>Variação desde '+(f?fd(f.d):"-")+'</span></div><div class="stat"><b>'+st.h+' cm</b><span>Altura</span></div><div class="stat"><b>'+imc+'</b><span>IMC</span></div></div>';

h+='<div class="card"><h2>Registrar peso</h2><div class="row"><label class="grow">Data<input type="date" id="wd" value="'+today+'"></label><label class="grow">Peso (kg)<input type="number" step="0.1" inputmode="decimal" id="wk"></label></div><div class="row"><span class="note" style="margin:0">Atalho:</span><button class="chip" data-a="chip" data-v="0">Hoje</button><button class="chip" data-a="chip" data-v="1">+1 mês</button><button class="chip" data-a="chip" data-v="2">+2 meses</button><button class="chip" data-a="chip" data-v="3">+3 meses</button></div><button class="btn" data-a="addw">Salvar peso</button><p class="note">Datas futuras aparecem como previstas e viram registro quando o dia chegar.</p></div>';
h+='<div class="card"><h2>Evolução</h2>'+chart(w)+'<div class="tbl"><table><tr><th>Data</th><th>Peso</th><th>Desde o início</th><th></th></tr>'+w.map(function(x,i){var d=x.k-f.k;return"<tr><td>"+fd(x.d)+(x.d>today?'<span class="tag">previsto</span>':"")+"</td><td>"+x.k+' kg</td><td class="'+(d>0?"up":"")+'">'+(i?(d>0?"+":"")+d.toFixed(1)+" kg":"-")+'</td><td><button class="x" data-a="rmw" data-i="'+i+'" aria-label="Remover">✕</button></td></tr>'}).join("")+"</table></div></div>";
return h}
function vE(L){var h=pl(L),g={};(st.log||[]).forEach(function(s){s.ex.forEach(function(e){var k=e.n.toLowerCase();(g[k]||(g[k]={n:e.n,p:[]})).p.push({d:s.d,l:e.l,s:e.s,r:e.r})})});
var ks=Object.keys(g);if(!ks.length)return h+'<p class="note">Nenhum treino salvo ainda. Preencha as cargas no treino e toque em Salvar treino de hoje.</p>';
ks.forEach(function(k){var p=g[k].p,f=p[0],l=p[p.length-1],d=l.l-f.l,mx=Math.max.apply(null,p.map(function(x){return x.l})),rw="";
for(var j=p.length-1;j>=Math.max(0,p.length-8);j--)rw+="<tr><td>"+fd(p[j].d)+"</td><td>"+p[j].s+"x"+p[j].r+"</td><td>"+p[j].l+" kg</td></tr>";
h+='<div class="card"><h2>'+esc(g[k].n)+'</h2><div class="row"><div class="grow"><b>'+l.l+' kg</b><div class="note" style="margin:0">Última ('+fd(l.d)+')</div></div><div class="grow"><b class="'+(d>0?"up":"")+'">'+(d>0?"+":"")+d+' kg</b><div class="note" style="margin:0">Desde '+fd(f.d)+' ('+f.l+' kg)</div></div><div class="grow"><b>'+mx+' kg</b><div class="note" style="margin:0">Maior carga</div></div></div>'+chart(p.map(function(x){return{d:x.d,k:x.l}}),"carga")+'<div class="tbl"><table><tr><th>Data</th><th>Séries x reps</th><th>Carga</th></tr>'+rw+"</table></div></div>"});return h}
function pc(s,k){if(!k||!s)return"-";var p=Math.round(s/k),m=Math.floor(p/60),x=p%60;return m+":"+(x<10?"0":"")+x+" /km"}
function vC(){var R=st.run||[],h='<div class="card"><h2>Registrar corrida</h2><div class="row"><label class="grow">Data<input type="date" id="rd" value="'+today+'"></label><label class="grow">Distância (km)<input type="number" step="0.01" inputmode="decimal" id="rk"></label></div><div class="row"><label class="grow">Minutos<input type="number" inputmode="numeric" id="rm"></label><label class="grow">Segundos<input type="number" inputmode="numeric" id="rs" value="0"></label></div><button class="btn" data-a="addrun">Salvar corrida</button><p class="note">O pace (min/km) é calculado automaticamente.</p></div>';
if(!R.length)return h;var tk=0,bp=0,rows="";R.forEach(function(x){tk+=x.km;var p=x.s/x.km;if(!bp||p<bp)bp=p});
for(var i=R.length-1;i>=0;i--){var x=R[i],m=Math.floor(x.s/60),s=x.s%60;rows+="<tr><td>"+fd(x.d)+"</td><td>"+x.km+" km</td><td>"+m+":"+(s<10?"0":"")+s+"</td><td>"+pc(x.s,x.km)+'</td><td><button class="x" data-a="rmrun" data-i="'+i+'" aria-label="Remover">✕</button></td></tr>'}
